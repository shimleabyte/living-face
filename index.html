<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111713">
  <meta name="description" content="An interactive portrait built from live CSS geometry.">
  <title>Living Face</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-mode="cartoon">
  <main class="artwork-canvas">
    <section class="face-stage" id="face-stage" aria-label="Interactive portrait">
      <div class="portrait-wrap">
        <div class="portrait-shadow" aria-hidden="true"></div>
        <div class="face-base" id="living-face" role="button" tabindex="0" aria-label="Animate the face expression. Eyes track pointer movement.">
              <div class="face-back-volume" aria-hidden="true"></div>
              <div class="face-neck" aria-hidden="true"><span class="neck-shadow"></span></div>
              <div class="face-ear face-ear--left" aria-hidden="true"><i></i><b></b></div>
              <div class="face-ear face-ear--right" aria-hidden="true"><i></i><b></b></div>

              <div class="face-surface">
                <div class="forehead-plane" aria-hidden="true"></div>
                <div class="temple-plane temple-plane--left" aria-hidden="true"></div>
                <div class="temple-plane temple-plane--right" aria-hidden="true"></div>
                <div class="brow-ridge brow-ridge--left" aria-hidden="true"></div>
                <div class="brow-ridge brow-ridge--right" aria-hidden="true"></div>
                <div class="under-eye-plane under-eye-plane--left" aria-hidden="true"></div>
                <div class="under-eye-plane under-eye-plane--right" aria-hidden="true"></div>
                <div class="cheek-plane cheek-plane--left" aria-hidden="true"></div>
                <div class="cheek-plane cheek-plane--right" aria-hidden="true"></div>
                <div class="jaw-plane" aria-hidden="true"></div>
                <div class="chin-plane" aria-hidden="true"></div>

                <div class="eyebrow eyebrow--left" aria-hidden="true">
                  <span class="eyebrow-body"></span><i class="eyebrow-hair eyebrow-hair--one"></i><i class="eyebrow-hair eyebrow-hair--two"></i><i class="eyebrow-hair eyebrow-hair--three"></i>
                </div>
                <div class="eyebrow eyebrow--right" aria-hidden="true">
                  <span class="eyebrow-body"></span><i class="eyebrow-hair eyebrow-hair--one"></i><i class="eyebrow-hair eyebrow-hair--two"></i><i class="eyebrow-hair eyebrow-hair--three"></i>
                </div>

                <div class="eye eye--left" aria-hidden="true">
                  <span class="eye-socket"></span>
                  <span class="eye-orbital-shadow"></span>
                  <span class="eyeball">
                    <span class="iris">
                      <span class="iris-ring iris-ring--outer"></span>
                      <span class="iris-ring iris-ring--inner"></span>
                      <span class="iris-fibers"></span>
                      <span class="pupil">
                        <i class="pupil-highlight pupil-highlight--primary"></i>
                        <i class="pupil-highlight pupil-highlight--secondary"></i>
                      </span>
                    </span>
                  </span>
                  <span class="upper-eyelid"><i class="upper-lashline"></i></span>
                  <span class="upper-eyelid-crease"></span>
                  <span class="lower-eyelid"><i class="lower-waterline"></i></span>
                  <span class="tear-duct"></span>
                  <span class="eye-corner eye-corner--outer"></span>
                </div>

                <div class="eye eye--right" aria-hidden="true">
                  <span class="eye-socket"></span>
                  <span class="eye-orbital-shadow"></span>
                  <span class="eyeball">
                    <span class="iris">
                      <span class="iris-ring iris-ring--outer"></span>
                      <span class="iris-ring iris-ring--inner"></span>
                      <span class="iris-fibers"></span>
                      <span class="pupil">
                        <i class="pupil-highlight pupil-highlight--primary"></i>
                        <i class="pupil-highlight pupil-highlight--secondary"></i>
                      </span>
                    </span>
                  </span>
                  <span class="upper-eyelid"><i class="upper-lashline"></i></span>
                  <span class="upper-eyelid-crease"></span>
                  <span class="lower-eyelid"><i class="lower-waterline"></i></span>
                  <span class="tear-duct"></span>
                  <span class="eye-corner eye-corner--outer"></span>
                </div>

                <div class="nose-structure" aria-hidden="true">
                  <span class="nose-glabella"></span>
                  <span class="nose-root"></span>
                  <span class="nose-bridge"></span>
                  <span class="nose-bridge-highlight"></span>
                  <span class="nose-sidewall nose-sidewall--left"></span>
                  <span class="nose-sidewall nose-sidewall--right"></span>
                  <span class="nose-tip"></span>
                  <span class="nose-tip-highlight"></span>
                  <span class="nose-alar nose-alar--left"></span>
                  <span class="nose-alar nose-alar--right"></span>
                  <span class="nose-nostril nose-nostril--left"></span>
                  <span class="nose-nostril nose-nostril--right"></span>
                  <span class="nose-columella"></span>
                  <span class="nose-cast-shadow"></span>
                </div>

                <div class="philtrum" aria-hidden="true"><span class="philtrum-column philtrum-column--left"></span><span class="philtrum-column philtrum-column--right"></span><span class="philtrum-well"></span></div>

                <div class="mouth-structure" aria-hidden="true">
                  <span class="mouth-smile-fold mouth-smile-fold--left"></span>
                  <span class="mouth-smile-fold mouth-smile-fold--right"></span>
                  <span class="upper-lip">
                    <i class="upper-lip-peak upper-lip-peak--left"></i>
                    <i class="upper-lip-peak upper-lip-peak--right"></i>
                    <i class="cupid-bow"></i>
                  </span>
                  <span class="mouth-cavity">
                    <span class="upper-gum"></span>
                    <span class="teeth">
                      <i class="tooth tooth--one"></i><i class="tooth tooth--two"></i><i class="tooth tooth--three"></i><i class="tooth tooth--four"></i><i class="tooth tooth--five"></i><i class="tooth tooth--six"></i>
                    </span>
                    <span class="tongue"><i class="tongue-groove"></i></span>
                    <span class="lower-gum"></span>
                  </span>
                  <span class="lower-lip"><i class="lower-lip-highlight"></i></span>
                  <span class="mouth-corner mouth-corner--left"></span>
                  <span class="mouth-corner mouth-corner--right"></span>
                  <span class="chin-cleft"></span>
                </div>

                <div class="skin-detail skin-detail--left" aria-hidden="true"></div>
                <div class="skin-detail skin-detail--right" aria-hidden="true"></div>
                <div class="face-speculars" aria-hidden="true"><i></i><b></b><span></span></div>
              </div>
              <div class="face-edge-light" aria-hidden="true"></div>
              <div class="face-grain" aria-hidden="true"></div>
              <div class="pixel-screen" aria-hidden="true"></div>
            </div>
      </div>
    </section>
  </main>
</body>
</html>
